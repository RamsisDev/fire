[project]
name = "fire"
version = "0.1.0"
description = "FIRE ENGINE — Failure Investigation & Root Explanation"
readme = "README.md"
authors = [{ name = "Ramsis Peñaloza" }]
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "httpcore>=1.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "moto[dynamodb,dynamodbstreams,kinesis,s3,sns,sqs]>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fire"]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "TID", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--tb=short", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as a unit test",
    "integration: end-to-end test of the body's API and pipeline, in tests/integration/",
]
